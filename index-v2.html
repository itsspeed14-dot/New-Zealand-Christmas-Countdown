<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Countdown 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@600;800&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #1a3a2a 0%, #09150f 100%);
    color: white;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .main-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 2;
    padding: 2vh 2vw;
    max-width: 90vw;
  }

  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(2.5rem, 5.2vw, 5.5rem);
    color: #ffd700;
    text-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    margin-bottom: 4vh;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .countdown-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1rem, 2.2vw, 2.5rem);
  }

  .time-box {
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 215, 0, 0.4);
    border-radius: 18px;
    padding: clamp(1.2rem, 2.5vh, 2.5rem) clamp(1.5rem, 2.5vw, 3rem);
    min-width: clamp(110px, 11vw, 180px);
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }

  .number {
    font-size: clamp(2.5rem, 5vw, 5.5rem);
    font-weight: 800;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  }

  .label {
    font-size: clamp(0.75rem, 1.1vw, 1.3rem);
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #ff4d4d;
    margin-top: 1.2vh;
  }

  .snowflake {
    position: fixed;
    top: -5vh;
    color: white;
    opacity: 0.75;
    pointer-events: none;
    z-index: 1;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% {
      transform: translateY(0vh) rotate(0deg);
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
    }
  }
</style>
</head>
<body>

  <div class="main-wrapper">
    <h1>Countdown to Christmas 2026</h1>

    <div class="countdown-container" id="timer">
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>
  </div>

<script>
  const targetDate = new Date("December 25, 2026 00:00:00").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      document.getElementById("timer").innerHTML = "<h1 style='font-size: clamp(3rem, 6vw, 6.5rem); color: #ff4d4d;'>MERRY CHRISTMAS!</h1>";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Generate falling snow across 100% of screen width and height
  for (let i = 0; i < 65; i++) {
    let flake = document.createElement("div");
    flake.className = "snowflake";
    flake.innerText = "❄";
    flake.style.left = (Math.random() * 100) + "vw";
    flake.style.animationDuration = (Math.random() * 6 + 6) + "s";
    flake.style.animationDelay = -(Math.random() * 12) + "s";
    flake.style.fontSize = (Math.random() * 14 + 10) + "px";
    flake.style.opacity = (Math.random() * 0.5 + 0.35).toFixed(2);
    document.body.appendChild(flake);
  }
</script>
</body>
</html>
