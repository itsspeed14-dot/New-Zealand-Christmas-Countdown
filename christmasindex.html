<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Countdown 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@600;800&display=swap');

  body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: radial-gradient(circle at center, #1a3a2a 0%, #09150f 100%);
    color: white;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: 110px;
    color: #ffd700;
    text-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    margin-bottom: 40px;
    letter-spacing: 3px;
  }

  .countdown-container {
    display: flex;
    gap: 40px;
  }

  .time-box {
    background: rgba(255, 255, 255, 0.08);
    border: 3px solid rgba(255, 215, 0, 0.4);
    border-radius: 20px;
    padding: 40px 50px;
    min-width: 200px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }

  .number {
    font-size: 110px;
    font-weight: 800;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .label {
    font-size: 26px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #ff4d4d;
    margin-top: 15px;
  }

  /* Simple CSS Snow Effect */
  .snowflake {
    position: absolute;
    top: -20px;
    color: white;
    font-size: 24px;
    opacity: 0.7;
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translateY(1120px); }
  }
</style>
</head>
<body>

  <h1>Countdown to Christmas 2026</h1>

  <div class="countdown-container" id="timer">
    <div class="time-box">
      <div class="number" id="days">00</div>
      <div class="label">Days</div>
    </div>
    <div class="time-box">
      <div class="number" id="hours">00</div>
      <div class="label">Hours</div>
    </div>
    <div class="time-box">
      <div class="number" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>
    <div class="time-box">
      <div class="number" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>
  </div>

<script>
  const targetDate = new Date("December 25, 2026 00:00:00").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      document.getElementById("timer").innerHTML = "<h1 style='font-size: 140px; color: #ff4d4d;'>MERRY CHRISTMAS!</h1>";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Generate falling snow
  for (let i = 0; i < 40; i++) {
    let flake = document.createElement("div");
    flake.className = "snowflake";
    flake.innerText = "❄";
    flake.style.left = Math.random() * 1920 + "px";
    flake.style.animationDuration = (Math.random() * 5 + 5) + "s";
    flake.style.animationDelay = (Math.random() * 5) + "s";
    flake.style.fontSize = (Math.random() * 15 + 10) + "px";
    document.body.appendChild(flake);
  }
</script>
</body>
</html>
